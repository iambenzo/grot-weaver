name: Catalogue bump

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalogue-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Propose a newer semconv catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Regenerate from the latest sources
        run: |
          go run ./cmd/catalogue-gen \
            -semconv latest \
            -genai-commit auto \
            -summary "${RUNNER_TEMP}/catalogue-summary.md"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- pkg/catalogue/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Catalogue is up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cat "${RUNNER_TEMP}/catalogue-summary.md"
          fi

      - name: Test against the new catalogue
        if: steps.changes.outputs.changed == 'true'
        run: go test ./pkg/... ./cmd/...

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: catalogue/bump
          delete-branch: true
          add-paths: pkg/catalogue/data
          commit-message: Update the semconv catalogue
          title: Update the semconv catalogue
          body-path: ${{ runner.temp }}/catalogue-summary.md
