receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
  otlp/enriched:
    protocols:
      http: {endpoint: 0.0.0.0:5318}
  prometheus/scrape_otlp:
    config:
      scrape_configs:
        - job_name: node-via-otelcol-otlp
          scrape_interval: 10s
          static_configs: [{targets: ["node-exporter:9100"]}]
  prometheus/scrape_prw:
    config:
      scrape_configs:
        - job_name: node-via-otelcol-prw
          scrape_interval: 10s
          static_configs: [{targets: ["node-exporter:9100"]}]
processors:
  batch: {}
  resource_detection/system:
    detectors: [system]
    system:
      hostname_sources: [os]
  resource/pipeline_tag:
    attributes:
      - {key: otelcol.pipeline, value: enriched, action: upsert}
exporters:
  otlp_http/prom:
    endpoint: http://prometheus:9090/api/v1/otlp
  otlp_http/promalt:
    endpoint: http://prometheus-alt:9090/api/v1/otlp
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  prometheusremotewrite/prom:
    endpoint: http://prometheus:9090/api/v1/write
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
service:
  telemetry:
    resource:
      attributes:
        - {name: service.instance.id, value: otelcol-local-1}
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus: {host: 0.0.0.0, port: 8888}
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/prom, otlp_http/promalt]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
    metrics/enriched:
      receivers: [otlp/enriched]
      processors: [resource_detection/system, resource/pipeline_tag, batch]
      exporters: [otlp_http/prom, otlp_http/promalt]
    traces/enriched:
      receivers: [otlp/enriched]
      processors: [resource_detection/system, resource/pipeline_tag, batch]
      exporters: [otlp_grpc/tempo]
    logs/enriched:
      receivers: [otlp/enriched]
      processors: [resource_detection/system, resource/pipeline_tag, batch]
      exporters: [otlp_http/loki]
    metrics/scrape_otlp:
      receivers: [prometheus/scrape_otlp]
      processors: [batch]
      exporters: [otlp_http/prom]
    metrics/scrape_prw:
      receivers: [prometheus/scrape_prw]
      processors: [batch]
      exporters: [prometheusremotewrite/prom]
