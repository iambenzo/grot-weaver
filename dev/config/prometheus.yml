global:
  scrape_interval: 10s
otlp:
  translation_strategy: UnderscoreEscapingWithSuffixes
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: otelcol
    static_configs: [{targets: ["otelcol:8888"]}]
